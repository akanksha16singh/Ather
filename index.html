<body><div id="app"></div><div class="toast" id="toast"></div><div id="modal"></div>
<script>
const API="/api";let S=null,role="hub",page="overview",theme=localStorage.getItem("ami-theme")||"day",selectedRider="R-1042",authToken=sessionStorage.getItem("ami-token")||"",profile=JSON.parse(sessionStorage.getItem("ami-user")||"null");
const roles=[
 {id:"rider",name:"Rider",sub:"Your rides, score and vehicle",icon:"two_wheeler"},
 {id:"fleet",name:"Fleet",sub:"Vehicles and operations",icon:"local_shipping"},
 {id:"insurer",name:"Insurance",sub:"Offers, policies and earnings",icon:"verified_user"},
 {id:"ather",name:"Ather Team",sub:"AI, decisions and governance",icon:"insights"}
];
const menus={
 fleet:[["overview","Overview","dashboard"],["vehicles","Vehicles","electric_scooter"],["safety","Rider safety","health_and_safety"],["maintenance","Maintenance","build"],["road","Road intelligence","route"]],
 insurer:[["overview","Overview","dashboard"],["portfolio","Rider segments","groups"],["policies","Policies & renewals","description"],["economics","Revenue analytics","monitoring"]],
 ather:[["overview","Overview","dashboard"],["agents","AI workbench","smart_toy"],["reviews","Human review","fact_check"],["impact","Insurance impact","trending_up"],["governance","Governance","admin_panel_settings"]]
};
const $=id=>document.getElementById(id);
const icon=n=>`<span class="icon">${n}</span>`;
async function api(path,opts={}){let headers={"Content-Type":"application/json",...(authToken?{Authorization:`Bearer ${authToken}`}:{}) ,...(opts.headers||{})};let r=await fetch(API+path,{...opts,headers});let d=await r.json();if(!r.ok)throw new Error(d.error||"Request failed");return d}
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(n){return "₹"+Number(n||0).toLocaleString("en-IN")}
function toast(t){let el=$("toast");el.textContent=t;el.style.display="block";clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display="none",2600)}
function themeToggle(){theme=theme==="day"?"night":"day";localStorage.setItem("ami-theme",theme);document.body.classList.toggle("night",theme==="night");if($("themeLabel"))$("themeLabel").textContent=theme==="night"?"Night":"Day"}
function setTheme(t){theme=t;document.body.classList.toggle("night",t==="night")}
function header(){return `<header class="topbar"><div class="brand"><img src="/public/ather-logo.png" alt="Ather"><span class="brand-divider"></span><span class="brand-name">MOBILITY INTELLIGENCE</span></div><div class="top-actions"><span class="mono muted hide-small">DEMO ENVIRONMENT</span><button class="btn theme-btn" onclick="themeToggle()">${icon("dark_mode")}<span id="themeLabel">${theme==="night"?"Night":"Day"}</span></button>${profile?`<span class="mono muted hide-small">${esc(profile.name)} · ${esc(profile.role.toUpperCase())}</span><button class="btn" onclick="logout()">Sign out</button>`:""}</div></header>`}
function landing(){return `${header()}<main class="landing"><div class="landing-top"><div class="eyebrow">ATHER MOBILITY INTELLIGENCE</div><h1>Where would you like to go?</h1><p class="intro">Choose an experience to explore the connected Ather ecosystem.</p></div><div class="role-grid">${roles.map(r=>`<button class="role-card" onclick="enter('${r.id}')"><span class="role-icon">${icon(r.icon)}</span><h2>${r.name}</h2><p>${r.sub}</p><span class="role-enter">Open ${r.name} ${icon("arrow_forward")}</span></button>`).join("")}</div><div class="landing-foot">Concept product demonstration · Illustrative data · Not an official Ather product</div></main>`}
function enter(r){if(!profile||profile.role!==r){toast("Sign in with the matching demo profile to open this workspace.");return}role=r;page="overview";render()}
function goHub(){role=profile?.role||"hub";page="overview";render()}
function loginPage(){return `${header()}<main class="landing" style="max-width:620px"><div class="landing-top"><div class="eyebrow">ATHER MOBILITY INTELLIGENCE</div><h1>Sign in to your workspace</h1><p class="intro">Choose a stakeholder profile. Each opens its own workspace and permissions.</p></div><section class="card"><div class="field"><label for="demoProfile">Stakeholder profile</label><select id="demoProfile" onchange="fillDemo()"><option value="">Select a demo profile</option><option value="rider@ather.demo|Ride@123">Rider</option><option value="fleet@ather.demo|Fleet@123">Fleet manager</option><option value="insurer@ather.demo|Insure@123">Insurance partner</option><option value="admin@ather.demo|Ather@123">Ather reviewer</option></select></div><form onsubmit="signIn(event)" style="margin-top:12px"><div class="field"><label for="loginEmail">Demo email</label><input id="loginEmail" type="email" required autocomplete="username" placeholder="Select a profile above"></div><div class="field" style="margin-top:12px"><label for="loginPassword">Password</label><input id="loginPassword" type="password" required autocomplete="current-password" placeholder="Select a profile above"></div><button class="btn primary" style="margin-top:16px;width:100%;justify-content:center">Sign in</button><div id="loginMessage" class="notice" style="margin-top:12px">Demo profile access is for walkthrough use.</div></form><details style="margin-top:14px"><summary>Demo account credentials</summary><div class="list-row"><span>Rider</span><code>rider@ather.demo · Ride@123</code></div><div class="list-row"><span>Fleet manager</span><code>fleet@ather.demo · Fleet@123</code></div><div class="list-row"><span>Insurance partner</span><code>insurer@ather.demo · Insure@123</code></div><div class="list-row"><span>Ather reviewer</span><code>admin@ather.demo · Ather@123</code></div></details></section><div class="landing-foot">Illustrative prototype · Synthetic data · Not an official Ather product</div></main>`}
function fillDemo(){const [email,password]=($("demoProfile").value||"|").split("|");$("loginEmail").value=email;$("loginPassword").value=password}
async function signIn(e){e.preventDefault();const msg=$("loginMessage");msg.textContent="Signing in…";try{const result=await api("/login",{method:"POST",body:JSON.stringify({email:$("loginEmail").value.trim(),password:$("loginPassword").value})});authToken=result.token;profile=result.user;sessionStorage.setItem("ami-token",authToken);sessionStorage.setItem("ami-user",JSON.stringify(profile));role=profile.role;selectedRider=profile.riderId||"R-1042";await load();toast(`Signed in as ${profile.name}`)}catch(err){msg.textContent=err.message;msg.className="notice warn"}}
async function logout(){try{await api("/logout",{method:"POST"})}catch{}authToken="";profile=null;S=null;sessionStorage.removeItem("ami-token");sessionStorage.removeItem("ami-user");role="hub";render()}
function sidebar(){let m=menus[role]||[];return `<aside class="sidebar"><div class="side-role"><div class="label">CURRENT WORKSPACE</div><strong>${roles.find(x=>x.id===role)?.name||"Workspace"}</strong></div><nav class="side-nav">${m.map(([id,label,ic])=>`<button class="${page===id?"active":""}" onclick="nav('${id}')">${icon(ic)}${label}</button>`).join("")}</nav><div class="side-bottom">Ather Mobility Intelligence<br><span class="mono">Concept build · v1.0</span></div></aside>`}
function nav(p){page=p;render()}
function head(k,title,sub,actions=""){return `<div class="page-head"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p>${sub}</p></div><div class="head-actions">${actions}</div></div>`}
function card(title,body,extra=""){return `<section class="card ${extra}"><div class="card-title"><h3>${title}</h3></div>${body}</section>`}
function kpi(label,val,note,trend=""){return `<section class="card"><div class="kpi-label">${label}</div><div class="kpi">${val}</div><div class="kpi-note">${trend?`<span class="positive">${trend}</span> · `:""}${note}</div></section>`}
function chart(vals,labels){return `<div class="chart">${vals.map((v,i)=>`<div class="col"><strong>${v}</strong><i style="height:${Math.max(4,v/Math.max(...vals)*100)}%"></i><small>${labels[i]}</small></div>`).join("")}</div>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`}
function render(){setTheme(theme);if(!profile){$("app").innerHTML=loginPage();return}if(!S){$("app").innerHTML=header()+`<main class="landing">Loading sample workspace…</main>`;return}if(role!==profile.role){role=profile.role}if(role==="rider"){$("app").innerHTML=header()+riderApp();return}
 const m=menus[role];$("app").innerHTML=header()+`<div class="shell">${sidebar()}<main class="main">${role==="fleet"?fleetPage():role==="insurer"?insurerPage():atherPage()}</main></div>`;
}
function riderApp(){let r=S.riders.find(x=>x.id===selectedRider)||S.riders[0];let active=page;return `<div class="phone-stage"><div class="phone"><div class="phone-top"><img src="/public/ather-logo.png" alt="Ather"><span>9:41 ◉ ▰</span></div><div class="phone-body">${active==="overview"?riderHome(r):active==="score"?riderScore(r):active==="health"?riderHealth(r):riderAccount(r)}</div><nav class="phone-tabs">${[["overview","home","Home"],["score","speed","Ride"],["health","ecg_heart","Health"],["account","person","Account"]].map(([id,ic,l])=>`<button class="${active===id?"active":""}" onclick="nav('${id}')">${icon(ic)}${l}</button>`).join("")}</nav></div></div>`}
function riderHome(r){return `<div class="phone-greeting">Good morning, ${esc(r.name.split(" ")[0])}</div><div class="phone-sub">${esc(r.vehicle)} · ${esc(r.city)}</div><div class="phone-card"><div class="row" style="display:flex;justify-content:space-between"><h3>YOUR RIDESCORE</h3><span class="pill">${esc(r.band)}</span></div><div class="phone-score"><div class="score-circle"><strong>${r.score??"—"}</strong></div><div><div class="phone-stat">OUT OF 900</div><div class="phone-stat" style="margin-top:8px">Last 90 days<b>${r.km90.toLocaleString()} km</b></div><div class="phone-stat" style="margin-top:7px">Data history<b>${r.days90} days</b></div></div></div><p class="phone-sub" style="margin-top:12px">Your score reflects riding patterns, not your identity.</p><button class="btn primary" style="width:100%;justify-content:center;margin-top:10px" onclick="nav('score')">Explore my score ${icon("arrow_forward")}</button></div><div class="phone-card"><div class="row"><h3>VEHICLE HEALTH</h3><span class="pill">${r.health}% healthy</span></div><div class="bar"><i style="width:${r.health}%"></i></div><div class="phone-list"><span>Battery & vehicle systems</span><b>${r.health}/100</b></div><div class="phone-list"><span>Service status</span><b>${r.health<88?"Check recommended":"All good"}</b></div><button class="btn" style="margin-top:10px" onclick="nav('health')">View vehicle health</button></div><div class="phone-card"><h3>YOUR LATEST INSIGHT</h3><div style="font-size:12px;font-weight:600">Keep your braking smooth.</div><p class="phone-sub">Progressive braking is one of the strongest positive signals in your recent rides.</p><div class="pill">AI-assisted coaching · Demo</div></div><div class="phone-card"><h3>INSURANCE & OWNERSHIP</h3><p class="phone-sub">Explore partner offers when you choose to share your eligible summary.</p><div class="phone-list"><span>Insurance sharing</span><b>${r.consent.insurance?"On":"Off"}</b></div><button class="btn" onclick="nav('account')">Manage privacy & offers</button></div>`}
function riderScore(r){return `<div class="eyebrow" style="color:#3DDC84">RIDE INTELLIGENCE</div><div class="phone-greeting">Your RideScore</div><div class="phone-sub">A 90-day view of your riding behaviour.</div><div class="phone-card"><div class="phone-score"><div class="score-circle"><strong>${r.score??"—"}</strong></div><div><span class="pill">${esc(r.band)}</span><div class="phone-stat" style="margin-top:9px">Data coverage<b>${r.days90} days · ${r.km90} km</b></div></div></div><div class="phone-list"><span>Safe riding</span><b>45%</b></div><div class="bar"><i style="width:82%"></i></div><div class="phone-list"><span>Rule following</span><b>25%</b></div><div class="bar"><i style="width:78%"></i></div><div class="phone-list"><span>Vehicle care</span><b>20%</b></div><div class="bar"><i style="width:${r.health}%"></i></div><div class="phone-list"><span>Exposure</span><b>10%</b></div><div class="notice" style="margin-top:12px;background:#18271E;border-color:#34543E;color:#C1E7CD">Illustrative score only. Not used for automated insurance underwriting or premium decisions.</div></div><div class="phone-card"><h3>WHAT IS HELPING YOUR SCORE</h3>${r.riskSignals.map(x=>`<div class="phone-list"><span>${esc(x)}</span><span style="color:#3DDC84">●</span></div>`).join("")}</div>`}
function riderHealth(r){return `<div class="eyebrow" style="color:#3DDC84">VEHICLE CARE</div><div class="phone-greeting">True Health</div><div class="phone-sub">Your vehicle's condition at a glance.</div><div class="phone-card"><div class="row" style="display:flex;justify-content:space-between"><h3>OVERALL HEALTH</h3><span class="pill">${r.health>=90?"Good":"Monitor"}</span></div><div style="font-size:42px;font-weight:700">${r.health}<span style="font-size:14px;color:#9DA7A1"> / 100</span></div><div class="bar"><i style="width:${r.health}%"></i></div><div class="phone-list"><span>Battery health</span><b>${Math.min(99,r.health+2)}%</b></div><div class="phone-list"><span>Vehicle systems</span><b>${r.health}%</b></div><div class="phone-list"><span>Odometer</span><b>12,400 km</b></div></div><div class="phone-card"><h3>CARE RECOMMENDATIONS</h3><div class="phone-list"><span>Brake inspection</span><span class="pill amber">Upcoming</span></div><div class="phone-list"><span>Tyre pressure check</span><span class="pill">Routine</span></div><button class="btn primary" style="margin-top:12px" onclick="requestService()">Request service</button>${(S.serviceRequests||[]).filter(x=>x.rider===r.id).slice(0,2).map(x=>`<div class="phone-list"><span>${esc(x.id)} · ${esc(x.preferredDate)}</span><span class="pill">${esc(x.status)}</span></div>`).join("")}</div>`}
async function requestService(){const d=new Date(Date.now()+86400000);const date=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;const preferredDate=prompt("Preferred service date (YYYY-MM-DD)",date);if(preferredDate===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(preferredDate)){toast("Enter the date as YYYY-MM-DD");return}try{await api("/service-requests",{method:"POST",body:JSON.stringify({preferredDate,service:"Vehicle health inspection"})});await load();toast("Service request saved. The request and preferred date are on your profile.")}catch(e){toast(e.message)}}
function riderAccount(r){return `<div class="eyebrow" style="color:#3DDC84">YOUR ACCOUNT</div><div class="phone-greeting">Privacy & preferences</div><div class="phone-sub">Signed in as ${esc(profile.name)} · ${esc(r.id)}</div><div class="phone-card"><h3>DATA PERMISSIONS</h3>${[["ridescore","RideScore calculation"],["insurance","Insurance partner sharing"],["claims","Claims evidence sharing"],["offers","Personalised offers"]].map(([k,l])=>`<div class="phone-list"><span>${l}</span><input aria-label="${l}" type="checkbox" ${r.consent[k]?"checked":""} onchange="setConsent('${r.id}','${k}',this.checked)" style="accent-color:#3DDC84;width:17px;height:17px"></div>`).join("")}</div><div class="phone-card"><h3>CLAIMS ASSISTANCE</h3>${S.claims.filter(c=>c.rider===r.id).map(c=>`<div class="phone-list"><span>${c.id} · ${esc(c.status)}</span><span class="pill">${c.consent?"Consent on":"Consent off"}</span></div><div style="display:flex;gap:6px;margin:8px 0 12px"><button class="btn primary" ${c.consent?"":"disabled"} onclick="claimAction('${c.id}','Share evidence')">Approve sharing</button><button class="btn" onclick="claimAction('${c.id}','Reject sharing')">Reject</button></div>`).join("")||`<p class="phone-sub">No open claim in this sample profile.</p>`}<button class="btn" onclick="requestDemo()" style="margin-top:10px">Request a product demo</button></div>`}
async function requestDemo(){try{await api("/demo-requests",{method:"POST",body:JSON.stringify({source:"Rider app",riderId:selectedRider,interest:"Mobility intelligence walkthrough"})});await load();toast("Demo request saved. A team member can follow up in this prototype.")}catch(e){toast(e.message)}}
async function setConsent(id,key,granted){try{await api(`/riders/${id}/consent`,{method:"PATCH",body:JSON.stringify({purpose:key,granted})});await load();toast("Permission updated and audit logged")}catch(e){toast(e.message)}}
function fleetPage(){let a=S.analytics;let rows=S.vehicles.map(v=>`<tr><td class="mono">${v.vin}</td><td>${v.model}</td><td>${v.fleet}</td><td>${v.health}%</td><td><span class="pill ${v.status==="Healthy"?"":"amber"}">${v.status}</span></td><td>${v.odo.toLocaleString()} km</td></tr>`).join("");return page==="overview"?head("FLEET OPERATIONS","Fleet intelligence","A live-style view of vehicle availability, health and rider safety across demo fleet accounts.")+`<div class="grid g4">${kpi("Vehicles in network","89","Across 3 demo fleets","+8.2%")}${kpi("Average vehicle health",a.avgHealth+"%","Synthetic diagnostic index","+2.4%")}${kpi("Fleet uptime","97.9%","Rolling 30-day view","+1.1%")}${kpi("Open maintenance alerts","12","5 require attention","")}</div><div class="grid g2" style="margin-top:14px">${card("Fleet health by account",S.fleets.map(f=>`<div class="list-row"><div><b>${esc(f.name)}</b><div class="tiny muted">${f.vehicles} vehicles · ${f.city}</div><div class="bar" style="width:220px;margin-top:7px"><i style="width:${f.health}%"></i></div></div><strong>${f.health}%</strong></div>`).join(""))}${card("Safety performance",chart([68,72,70,77,81,84,88],["W1","W2","W3","W4","W5","W6","W7"])+`<div class="tiny muted">Illustrative safety index · aggregated only</div>`)}</div><div class="grid g2" style="margin-top:14px">${card("Operational alerts",`<div class="list-row"><span>Brake inspection due</span><span class="pill amber">5 vehicles</span></div><div class="list-row"><span>Battery health watch</span><span class="pill amber">4 vehicles</span></div><div class="list-row"><span>Telemetry gaps</span><span class="pill red">3 vehicles</span></div>`)}${card("AI-assisted fleet insight",`<div class="notice">Maintenance Agent identified a cluster of service reminders across two vehicle cohorts. Suggested action: schedule inspections in the next service cycle. Human fleet manager confirmation required.</div>`)}</div>`:head("FLEET OPERATIONS",page==="vehicles"?"Vehicle register":page==="safety"?"Rider safety trends":page==="maintenance"?"Predictive maintenance":"Road intelligence","Aggregated fleet insights. Individual rider routes and precise GPS trails are not exposed.")+(page==="vehicles"?card("Vehicles",table(["VIN","Model","Fleet","Health","Status","Odometer"],rows)):page==="safety"?`<div class="grid g3">${kpi("Eligible score coverage","87%","Fleet members meeting minimum data")}${kpi("Smooth / steady cohort","74%","Aggregated demo distribution")}${kpi("Coaching opportunities","16","Human-reviewed recommendations")}</div><div class="grid g2" style="margin-top:14px">${card("Safety index trend",chart([64,68,69,73,79,82,86],["W1","W2","W3","W4","W5","W6","W7"]))}${card("Top fleet opportunities",`<div class="list-row"><b>Progressive braking coaching</b><span>9 riders</span></div><div class="list-row"><b>Tyre pressure reminders</b><span>5 vehicles</span></div><div class="list-row"><b>Service adherence nudges</b><span>7 riders</span></div>`)}</div>`:page==="maintenance"?card("Predictive maintenance queue",S.vehicles.filter(v=>v.health<90).map(v=>`<div class="list-row"><div><b>${v.vin}</b><div class="tiny muted">${v.model} · ${v.fleet}</div></div><span class="pill amber">${v.health}% health · Review</span></div>`).join("")):card("Road intelligence",`<div class="notice">Road signals are aggregated into coarse segments only after privacy thresholds are met. No individual rider trail is visible in this workspace.</div><div class="grid g3" style="margin-top:12px">${kpi("Candidate segments","28","Synthetic sample")}${kpi("Privacy threshold","15","Minimum aggregate trips")}${kpi("Published segments","19","Threshold passed")}</div>`))}
function insurerPage(){let a=S.analytics;let rows=S.insuranceRows.map(r=>`<tr><td class="mono">${r.reference}</td><td>${r.scoreBand}</td><td>${r.distanceRange}</td><td>${r.validity}</td><td><span class="pill">${r.consent}</span></td></tr>`).join("");let policies=S.policies.map(p=>`<tr><td class="mono">${p.id}</td><td>${p.insurer}</td><td>${p.product}</td><td>${money(p.premium)}</td><td>${p.commission}%</td><td><span class="pill ${p.status==="Converted"?"":"amber"}">${p.status}</span></td></tr>`).join("");return page==="overview"?head("INSURANCE PARTNER","Insurance performance","A consent-led distribution and analytics workspace. Insurers retain ownership of underwriting, pricing and policy decisions.")+`<div class="grid g4">${kpi("Consented eligible pool",a.consented,"Riders with active sharing consent")}${kpi("Policies converted",a.converted,"Illustrative policy records","+18%")}${kpi("Gross premium",money(a.grossPremium),"Converted sample policies")}${kpi("Ather commission",money(a.commissionRevenue),"Illustrative distribution revenue","+12%")}</div><div class="grid g2" style="margin-top:14px">${card("Distribution funnel",`<div class="funnel">${[["Eligible riders",a.eligible,100],["Sharing consent",a.consented,Math.round(a.consented/Math.max(1,a.eligible)*100)],["Offers viewed",6,60],["Quotes initiated",4,40],["Policies converted",a.converted,Math.round(a.converted/Math.max(1,a.eligible)*100)]].map(([l,n,w])=>`<div class="funnel-row"><span>${l}</span><div class="funnel-track"><i style="width:${w}%"></i></div><b>${n}</b></div>`).join("")}</div>`)}${card("Commission by insurer",`<div class="list-row"><b>Insurer A</b><span>${money(2140*.12+860*.10)}</span></div><div class="bar"><i style="width:78%"></i></div><div class="list-row"><b>Insurer B</b><span>${money(2050*.14)}</span></div><div class="bar"><i style="width:58%"></i></div><div class="list-row"><b>Insurer C</b><span>${money(0)}</span></div><div class="bar"><i style="width:4%"></i></div><div class="tiny muted">Illustrative commissions from seeded conversions.</div>`)}</div><div class="grid g2" style="margin-top:14px">${card("Consented rider segments",table(["Reference","Band","Distance","Validity","Consent"],rows))}${card("Commercial opportunity",`<div class="notice">The value proposition is a consent-led insurance distribution channel. Ather can monetise qualified customer engagement through insurer partnerships, referral / distribution commissions and renewal journeys — subject to contracts, compliance and customer consent.</div><div class="list-row"><span>Illustrative commission rate</span><b>10–14%</b></div><div class="list-row"><span>Revenue model</span><b>Per converted policy</b></div><div class="list-row"><span>Customer data shared</span><b>Limited summary only</b></div>`)}</div>`:page==="portfolio"?head("INSURANCE PARTNER","Rider segments","Only pseudonymous summaries from riders who enabled insurance-sharing consent are shown.")+card("Consented segment data",table(["Reference","Score band","Distance band","Validity","Consent"],rows)):page==="policies"?head("INSURANCE PARTNER","Policies & renewals","Illustrative policy funnel and status. No quote or underwriting API is connected.")+card("Policy register",table(["Policy","Insurer","Product","Premium","Commission","Status"],policies)):head("INSURANCE PARTNER","Revenue analytics","Illustrative economics from sample conversions; not a forecast or guaranteed revenue.")+`<div class="grid g3">${kpi("Commission revenue",money(a.commissionRevenue),"Current seeded conversions")}${kpi("Average premium",money(a.converted?Math.round(a.grossPremium/a.converted):0),"Gross premium per conversion")}${kpi("Conversion rate",a.conversion+"%","Sample conversions / consented pool")}</div><div class="grid g2" style="margin-top:14px">${card("Monthly premium volume",chart([38,45,52,48,66,74,89],["Apr","May","Jun","Jul","Aug","Sep","Oct"]))}${card("Revenue levers",`<div class="list-row"><b>Consent opt-in</b><span>Customer trust</span></div><div class="list-row"><b>Offer relevance</b><span>Conversion</span></div><div class="list-row"><b>Renewal reminders</b><span>Retention</span></div><div class="list-row"><b>Insurer mix</b><span>Commission yield</span></div>`)}</div>`}

function atherPage(){let a=S.analytics;let pending=S.agentRuns.filter(x=>x.status==="Awaiting human decision"||x.status==="Returned for more data");return page==="overview"?head("ATHER INTELLIGENCE CONSOLE","Mobility intelligence overview","One console for the AI workflow, human decisions, partner economics and governance.",`<button class="btn primary" onclick="nav('agents')">${icon("play_arrow")} Run AI workflow</button>`)+`<div class="grid g4">${kpi("Riders in demo",a.riders,"Synthetic rider profiles")}${kpi("Insurance-consented",a.consented,"Purpose-specific opt-in")}${kpi("Agent workflows",a.agentRuns,"Across the sample environment")}${kpi("Commission revenue",money(a.commissionRevenue),"Illustrative conversions","+12%")}</div><div class="grid g2" style="margin-top:14px">${card("AI-to-human decision loop",`<div class="list-row"><span>01 · Telemetry & data quality</span><span class="pill">Agents</span></div><div class="list-row"><span>02 · Behaviour, health & exposure analysis</span><span class="pill">Agents</span></div><div class="list-row"><span>03 · LLM Judge checks evidence and policy</span><span class="pill amber">Judge</span></div><div class="list-row"><span>04 · Human reviewer makes final decision</span><span class="pill">Human</span></div><div class="list-row"><span>05 · Approved actions create auditable outcomes</span><span class="pill">Audit</span></div><button class="btn primary" style="margin-top:12px" onclick="nav('agents')">Open AI workbench ${icon("arrow_forward")}</button>`)}${card("Human review queue",`<div class="kpi">${pending.length}</div><div class="kpi-note">Workflows awaiting a human decision</div>${pending.slice(0,3).map(r=>`<div class="list-row"><div><b>${esc(r.id)}</b><div class="tiny muted">${esc(r.headline)}</div></div><span class="pill amber">Pending</span></div>`).join("")||`<div class="tiny muted">No pending decisions. Run the agent workflow to create a review item.</div>`}<button class="btn" style="margin-top:9px" onclick="nav('reviews')">Review queue</button>`)}</div><div class="grid g2" style="margin-top:14px">${card("Insurance value creation",`<div class="kpi positive">${money(a.commissionRevenue)}</div><div class="kpi-note">Illustrative Ather commission revenue from seeded policy conversions</div><div class="bar" style="margin:13px 0"><i style="width:${Math.min(100,a.conversion*4)}%"></i></div><div class="list-row"><span>Eligible riders</span><b>${a.eligible}</b></div><div class="list-row"><span>Active insurance consent</span><b>${a.consented}</b></div><div class="list-row"><span>Converted policies</span><b>${a.converted}</b></div><button class="btn" onclick="nav('impact')">Explore commercial impact</button>`)}${card("Model & governance health",`<div class="list-row"><span>Agent workflow engine</span><span class="pill">Demo operational</span></div><div class="list-row"><span>LLM Judge</span><span class="pill">Policy checks active</span></div><div class="list-row"><span>Human-in-the-loop</span><span class="pill">Required</span></div><div class="list-row"><span>Automated underwriting</span><span class="pill red">Disabled</span></div><button class="btn" onclick="nav('governance')">Open governance</button>`)}</div>`:page==="agents"?head("MULTI-AGENT INTELLIGENCE","AI workbench","Specialist agents analyse permitted signals. The LLM Judge checks evidence and policy. A human makes the final decision.",`<button class="btn" onclick="nav('reviews')">Review queue (${pending.length})</button>`)+`<div class="card"><div class="grid g2" style="align-items:end"><div class="field"><label>Choose a synthetic rider profile</label><select id="agentRider">${S.riders.map(r=>`<option value="${r.id}" ${r.id===selectedRider?"selected":""}>${esc(r.name)} · ${r.id} · ${r.band}</option>`).join("")}</select></div><div class="field"><label>Workflow purpose</label><select id="workflowPurpose"><option value="Rider coaching & maintenance insights">Rider coaching & maintenance insights</option><option value="Consent-led insurance opportunity">Consent-led insurance opportunity</option><option value="Vehicle health review">Vehicle health review</option></select></div></div><div class="row" style="display:flex;justify-content:space-between;align-items:center;margin-top:12px"><span class="tiny muted">Runs 5 specialist agents + 1 LLM Judge · synthetic data only</span><button class="btn primary" onclick="runAgents()">${icon("play_arrow")} Run analysis</button></div></div><div id="agentOutput">${S.agentRuns[0]?renderRun(S.agentRuns[0]):`<div class="empty-state">Run the workflow to see the agent hand-offs, judge checks and human review brief.</div>`}</div>`:page==="reviews"?head("HUMAN-IN-THE-LOOP","Decision workspace","The AI prepares evidence. The reviewer owns the decision. No recommendation is published until a human acts.")+`${pending.length?pending.map(r=>reviewCard(r)).join(""):`<div class="card"><div class="eyebrow">ALL CAUGHT UP</div><h2 style="margin:8px 0">No pending decisions</h2><p class="muted">Run the AI workbench to create a new review brief.</p><button class="btn primary" onclick="nav('agents')">Run AI workflow</button></div>`}<div class="card" style="margin-top:14px"><div class="card-title"><h3>Recently reviewed</h3></div>${S.agentRuns.filter(x=>x.decision!=="Pending").slice(0,5).map(r=>`<div class="list-row"><div><b>${esc(r.id)} · ${esc(r.rider)}</b><div class="tiny muted">${esc(r.headline)}</div></div><span class="pill ${r.decision==="Approved"?"":"grey"}">${esc(r.decision)}</span></div>`).join("")}</div>`:page==="impact"?head("COMMERCIAL VALUE","Insurance distribution impact","Ather's proposed monetisation layer: turn consented mobility insights into relevant insurance journeys and earn distribution commissions when policies convert.")+`<div class="grid g4">${kpi("Commission revenue",money(a.commissionRevenue),"Illustrative seeded conversions","+12%")}${kpi("Gross premium",money(a.grossPremium),"Premium value of converted policies")}${kpi("Consented pool",a.consented,"Eligible riders with opt-in")}${kpi("Policy conversion",a.conversion+"%","Demo conversions / consented pool")}</div><div class="grid g2" style="margin-top:14px">${card("Insurance conversion funnel",`<div class="funnel">${[["Rider base",a.riders,100],["Score eligible",a.eligible,Math.round(a.eligible/a.riders*100)],["Insurance consent",a.consented,Math.round(a.consented/a.riders*100)],["Quote / offer viewed",6,60],["Policy converted",a.converted,Math.round(a.converted/a.riders*100)]].map(([l,n,w])=>`<div class="funnel-row"><span>${l}</span><div class="funnel-track"><i style="width:${w}%"></i></div><b>${n}</b></div>`).join("")}</div>`)}${card("Commission sensitivity",`<div class="tiny muted">Scenario model using current illustrative gross premium.</div>${[8,10,12,14,16].map(rate=>`<div class="list-row"><span>${rate}% commission</span><b>${money(a.grossPremium*rate/100)}</b></div>`).join("")}<div class="notice warn" style="margin-top:10px">Illustrative scenario only. Commercial terms, tax, cancellations, compliance and insurer contracts are not modelled.</div>`)}</div><div class="grid g2" style="margin-top:14px">${card("How AI supports the business",`<div class="list-row"><b>Data quality agent</b><span>Reduces bad input</span></div><div class="list-row"><b>Riding behaviour agent</b><span>Finds coaching insights</span></div><div class="list-row"><b>Vehicle health agent</b><span>Surfaces service needs</span></div><div class="list-row"><b>Exposure agent</b><span>Builds coarse risk context</span></div><div class="list-row"><b>Insurance opportunity agent</b><span>Finds consented journeys</span></div><div class="list-row"><b>LLM Judge + human</b><span>Controls quality and action</span></div>`)}${card("Value exchange",`<div class="list-row"><b>Rider</b><span>Coaching, care and choice</span></div><div class="list-row"><b>Ather</b><span>Distribution commission</span></div><div class="list-row"><b>Insurer</b><span>Consented customer engagement</span></div><div class="list-row"><b>Governance</b><span>Auditable decisions</span></div>`)}</div><div class="grid g2" style="margin-top:14px">${card("Machine-learning insights",`<div class="list-row"><b>Vehicle service propensity</b><span class="pill">0.84 confidence</span></div><div class="list-row"><b>Rider coaching relevance</b><span class="pill">0.91 confidence</span></div><div class="list-row"><b>Renewal engagement window</b><span class="pill">30-day signal</span></div><div class="list-row"><b>Fleet health anomaly</b><span class="pill amber">4 alerts</span></div><div class="tiny muted">Synthetic demo model outputs for service and engagement planning only. Not an insurance risk score.</div>`)}${card("AI contribution to decision quality",`<div class="list-row"><b>Signal extraction</b><span>Specialist agents</span></div><div class="list-row"><b>Evidence synthesis</b><span>LLM Judge</span></div><div class="list-row"><b>Exception handling</b><span>Human reviewer</span></div><div class="list-row"><b>Action accountability</b><span>Audit trail</span></div><div class="notice" style="margin-top:9px">AI assists analysis; humans retain decision rights. No autonomous policy pricing, underwriting or claim approval.</div>`)}</div>`:head("TRUST & GOVERNANCE","Model governance","Audit AI workflows, human decisions, rider permissions and data boundaries.")+`<div class="grid g4">${kpi("AI workflows",S.agentRuns.length,"Persisted demo runs")}${kpi("Human approved",S.agentRuns.filter(x=>x.decision==="Approved").length,"Explicit reviewer decisions")}${kpi("Open review",pending.length,"Awaiting human action")}${kpi("Audit events",S.audit.length,"Persisted actions")}</div><div class="grid g2" style="margin-top:14px">${card("Guardrails",`<div class="list-row"><b>Purpose-specific consent</b><span class="pill">Enforced in API</span></div><div class="list-row"><b>Raw GPS to insurer</b><span class="pill red">Never shared</span></div><div class="list-row"><b>Automated underwriting</b><span class="pill red">Disabled</span></div><div class="list-row"><b>Claims evidence</b><span class="pill">Rider approval required</span></div><div class="list-row"><b>Human decision</b><span class="pill">Mandatory</span></div>`)}${card("Agent workflow controls",`<div class="list-row"><b>Model / prompt version</b><span class="mono">ami-agent-demo-v1.0</span></div><div class="list-row"><b>Judge policy pack</b><span class="mono">policy-demo-v1.0</span></div><div class="list-row"><b>Decision mode</b><span>Human-in-the-loop</span></div><div class="list-row"><b>Production LLM</b><span class="pill amber">Not connected</span></div>`)}</div><div class="card" style="margin-top:14px"><div class="card-title"><h3>Audit trail</h3><button class="btn" onclick="downloadAudit()">Export CSV</button></div>${table(["Time","Actor","Action","Target","Purpose"],S.audit.slice(0,20).map(x=>`<tr><td class="mono">${new Date(x.time).toLocaleString()}</td><td>${esc(x.actor)}</td><td>${esc(x.action)}</td><td>${esc(x.target)}</td><td>${esc(x.purpose)}</td></tr>`).join(""))}</div>`}
function renderRun(r){let agents=r.agentDetails||[];return `<div class="card" style="margin-top:14px"><div class="card-title"><h3>Workflow ${esc(r.id)}</h3><span class="pill ${r.decision==="Pending"?"amber":""}">${esc(r.status)}</span></div><div class="agent-grid">${agents.map(a=>`<div class="agent"><div class="agent-icon">${icon(a.name.includes("Telemetry")?"database":a.name.includes("Behaviour")?"psychology":a.name.includes("Health")?"ecg_heart":a.name.includes("Exposure")?"route":"handshake")}</div><h4>${esc(a.name)}</h4><p>${esc(a.output)}</p><div class="status">${a.status} · ${Math.round(a.confidence*100)}%</div><details style="margin-top:7px"><summary class="tiny muted">Evidence</summary><ul class="tiny muted">${a.evidence.map(e=>`<li>${esc(e)}</li>`).join("")}</ul></details></div>`).join("")||agents.map(n=>`<div class="agent"><h4>${esc(n)}</h4><p>Completed</p></div>`).join("")}</div>${r.judge?`<div class="judge" style="margin-top:14px"><div class="row" style="display:flex;justify-content:space-between;align-items:center"><div><div class="eyebrow">LLM JUDGE · REVIEW BRIEF</div><h3 style="margin:6px 0">${esc(r.judge.verdict)}</h3><div class="tiny muted">${esc(r.judge.reason)}</div></div><div class="judge-score">${Math.round(r.judge.score*100)}<small style="font-size:11px">/100</small></div></div><div class="grid g2" style="margin-top:12px">${r.judge.checks.map(c=>`<div class="judge-check"><span>${esc(c.label)}</span><b>${esc(c.result)}</b></div>`).join("")}</div></div>`:""}<div class="notice warn" style="margin-top:12px">The Judge is a simulated policy-checking component in this prototype, not a connected external LLM. Its output is advisory. A human must make the final decision.</div></div>`}
function reviewCard(r){return `<div class="review-card" style="margin-bottom:12px"><div class="row" style="display:flex;justify-content:space-between"><div><div class="eyebrow">${esc(r.id)} · ${esc(r.rider)}</div><h3 style="margin:6px 0">${esc(r.headline)}</h3><div class="tiny muted">Judge confidence ${Math.round((r.judgeScore||0)*100)}% · Created ${new Date(r.createdAt).toLocaleString()}</div></div><span class="pill amber">Human decision needed</span></div><p class="tiny muted">${esc(r.summary)}</p>${r.judge?`<div class="notice">${esc(r.judge.reason)}</div>`:""}<div class="field" style="margin-top:10px"><label>Reviewer note</label><textarea id="note-${r.id}" placeholder="Record why you are approving, rejecting or requesting more data..."></textarea></div><div class="review-actions"><button class="btn primary" onclick="review('${r.id}','Approved')">Approve recommendation</button><button class="btn warn" onclick="review('${r.id}','Needs more data')">Request more data</button><button class="btn danger" onclick="review('${r.id}','Rejected')">Reject</button></div></div>`}
async function runAgents(){selectedRider=$("agentRider").value;let purpose=$("workflowPurpose").value;try{let r=await api("/agent-runs",{method:"POST",body:JSON.stringify({riderId:selectedRider,purpose})});await load(false);$("agentOutput").innerHTML=renderRun(r);toast("Five agents and the Judge completed. Human review required.")}catch(e){toast(e.message)}}
async function review(id,decision){let note=$("note-"+id)?.value||"";try{await api(`/reviews/${id}`,{method:"POST",body:JSON.stringify({decision,note,reviewer:"Ather Product Reviewer",purpose:"Mobility intelligence recommendation"})});await load();toast(`Human decision recorded: ${decision}`)}catch(e){toast(e.message)}}
async function claimAction(id,decision){try{await api(`/claims/${id}`,{method:"PATCH",body:JSON.stringify({decision,actor:"Rider demo"})});await load();toast("Claims action saved")}catch(e){toast(e.message)}}
function downloadAudit(){let rows=[["time","actor","action","target","purpose"],...S.audit.map(x=>[x.time,x.actor,x.action,x.target,x.purpose])];let csv=rows.map(row=>row.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(",")).join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="ather-mobility-audit.csv";a.click();URL.revokeObjectURL(a.href)}
async function resetDemo(){if(!confirm("Reset the sample data and all demo decisions?"))return;await api("/reset",{method:"POST"});await load();toast("Demo data reset")}
async function load(shouldRender=true){S=await api("/state");if(shouldRender)render()}
// Keep role entry predictable when users switch between the demo profiles.
const originalSignIn=signIn;signIn=async e=>{await originalSignIn(e);if(profile){page="overview";render()}};
const originalLogout=logout;logout=async()=>{await originalLogout();page="overview"};
// Use an in-app form for service dates so the journey works consistently on desktop and mobile browsers.
function requestService(){const d=new Date(Date.now()+86400000),date=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;$("modal").innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeServiceModal()"><section class="modal"><div class="eyebrow">VEHICLE CARE</div><h2>Request a service visit</h2><p class="muted">Choose a preferred date. This saves a demo request to your rider profile.</p><div class="field"><label for="serviceDate">Preferred service date</label><input id="serviceDate" type="date" min="${date}" value="${date}" required></div><div class="review-actions"><button class="btn" onclick="closeServiceModal()">Cancel</button><button class="btn primary" onclick="saveServiceRequest()">Save service request</button></div><div id="serviceMessage" class="tiny muted" style="margin-top:8px"></div></section></div>`}
function closeServiceModal(){$("modal").innerHTML=""}
async function saveServiceRequest(){const preferredDate=$("serviceDate").value;if(!preferredDate){$("serviceMessage").textContent="Choose a preferred date to continue.";return}try{await api("/service-requests",{method:"POST",body:JSON.stringify({preferredDate,service:"Vehicle health inspection"})});closeServiceModal();await load();toast("Service request saved. The request and preferred date are on your profile.")}catch(e){$("serviceMessage").textContent=e.message}}
(async()=>{if(!authToken){render();return}try{role=profile?.role||"hub";page="overview";await load()}catch(e){authToken="";profile=null;sessionStorage.removeItem("ami-token");sessionStorage.removeItem("ami-user");render()}})();
</script></body></html>
